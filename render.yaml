services:
  - type: web
    name: estetica-auto-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: estetica-auto-db
          property: connectionString
      - key: ALLOWED_ORIGIN
        sync: false
      - key: WHATSAPP_AUTH_DIR
        value: /var/data/whatsapp-auth
    disk:
      name: whatsapp-session
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: estetica-auto-db
    plan: basic-256mb